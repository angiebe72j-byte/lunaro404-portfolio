<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-label="Astronauta de LUNARO saludando">
  <defs>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3b63"/>
      <stop offset="55%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#4da6ff"/>
    </linearGradient>
    <linearGradient id="traje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd9ec"/>
    </linearGradient>
    <style>
      /* El brazo derecho gira desde el hombro: ese es el saludo. */
      .saludo { transform-origin: 140px 118px; animation: saludar 1.6s ease-in-out infinite; }
      @keyframes saludar {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(22deg); }
      }
      /* Las estrellas del casco parpadean para que no se vea estatico. */
      .brillo { animation: brillar 2.4s ease-in-out infinite; }
      .brillo2 { animation: brillar 2.4s ease-in-out infinite 1.2s; }
      @keyframes brillar { 0%,100% { opacity:.25 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .saludo, .brillo, .brillo2 { animation: none; }
      }
    </style>
  </defs>

  <!-- mochila -->
  <rect x="62" y="112" width="76" height="72" rx="20" fill="#9fb4cf"/>
  <!-- piernas -->
  <path d="M82 178h14v40a7 7 0 0 1-14 0z" fill="url(#traje)" stroke="#8fa5c0" stroke-width="3"/>
  <path d="M104 178h14v40a7 7 0 0 1-14 0z" fill="url(#traje)" stroke="#8fa5c0" stroke-width="3"/>
  <rect x="76" y="212" width="26" height="16" rx="8" fill="#4da6ff"/>
  <rect x="98" y="212" width="26" height="16" rx="8" fill="#4da6ff"/>

  <!-- brazo izquierdo -->
  <path d="M66 122c-12 4-18 16-16 30" fill="none" stroke="url(#traje)" stroke-width="19" stroke-linecap="round"/>
  <path d="M66 122c-12 4-18 16-16 30" fill="none" stroke="#8fa5c0" stroke-width="19" stroke-linecap="round" opacity=".18"/>
  <circle cx="50" cy="156" r="11" fill="#fff" stroke="#8fa5c0" stroke-width="3"/>

  <!-- torso -->
  <rect x="62" y="108" width="76" height="76" rx="26" fill="url(#traje)" stroke="#8fa5c0" stroke-width="3"/>
  <rect x="84" y="132" width="32" height="24" rx="7" fill="#0f1d30"/>
  <circle cx="93" cy="144" r="3.5" fill="#4da6ff"/>
  <circle cx="107" cy="144" r="3.5" fill="#7bd4ff"/>

  <!-- brazo derecho: el que saluda -->
  <g class="saludo">
    <path d="M136 122c16 0 24-14 26-30" fill="none" stroke="url(#traje)" stroke-width="19" stroke-linecap="round"/>
    <circle cx="163" cy="88" r="12" fill="#fff" stroke="#8fa5c0" stroke-width="3"/>
  </g>

  <!-- casco -->
  <circle cx="100" cy="66" r="48" fill="url(#traje)" stroke="#8fa5c0" stroke-width="3"/>
  <circle cx="100" cy="66" r="36" fill="url(#visor)"/>
  <path d="M78 52c6-8 16-12 26-11" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <circle class="brillo" cx="112" cy="58" r="3" fill="#ffffff"/>
  <circle class="brillo2" cx="92" cy="78" r="2.4" fill="#7bd4ff"/>
</svg>
